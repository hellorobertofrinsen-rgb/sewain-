<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SewAIn - Property Manager</title>
    <meta name="description" content="Admin buat agen sewa properti: prospek, unit, dan tenant di satu tempat." />
    <meta name="theme-color" content="#F4F5F7" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
    <!-- iPhone / iPad: "Add to Home Screen" opens full screen like an app -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SewAIn" />
    <style id="expo-reset">
      /* Feel installed, not embedded (mobile-native). Each rule is here for a reason: */
      html {
        -webkit-tap-highlight-color: transparent; /* no gray flash on tap; buttons have their own press state */
        -webkit-text-size-adjust: 100%; /* no font inflation in landscape */
        text-size-adjust: 100%;
      }
      html, body {
        height: 100%;
        background: #F4F5F7;
        overscroll-behavior: none; /* no pull-to-refresh / page rubber-band behind the app */
      }
      body { overflow: hidden; margin: 0; }
      #root { display: flex; flex: 1; height: 100%; height: 100dvh; } /* tracks the visible area as the URL bar shows/hides */
      /* iOS zooms into focused inputs under 16px; fix the cause instead of disabling zoom */
      @media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
      /* Controls: fire taps immediately and don't select their label on long-press. Content text stays selectable. */
      [role="button"], [role="link"], [role="tab"] {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      [role="checkbox"], [role="switch"] { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
      input[type="date"], input[type="time"] { color-scheme: light; }
      /* Focus: no browser ring after a tap; a soft brand ring for keyboard users, and a glow on the field being typed in. */
      :focus { outline: none; }
      :focus-visible { outline: 2px solid rgba(36, 87, 214, 0.55); outline-offset: 2px; }
      input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(36, 87, 214, 0.45); }
    </style>
  </head>
  <body>
    <noscript>SewAIn butuh JavaScript untuk berjalan.</noscript>
    <div id="root"></div>
  </body>
</html>
